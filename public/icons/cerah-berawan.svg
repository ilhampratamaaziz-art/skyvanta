    <g stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round">
      <line x1="36" y1="7" x2="36" y2="10.5" />
      <line x1="50" y1="18" x2="53" y2="16.5" />
      <line x1="52" y1="28" x2="55.5" y2="28" />
      <line x1="23" y1="14" x2="20.5" y2="12" />
      <line x1="46" y1="10" x2="48" y2="8" />
